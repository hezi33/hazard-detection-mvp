<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法可视化演示 - 修复版</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
        }
        
        .upload-area {
            border: 3px dashed #4CAF50;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            background: #f9f9f9;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .upload-area:hover {
            background: #e8f5e9;
            border-color: #45a049;
        }
        
        .image-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .image-box {
            flex: 1;
            border: 2px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border: 1px solid #ccc;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        .message {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 算法可视化演示 - 修复版</h1>
        <p>修复了文件上传和预览问题</p>
    </div>
    
    <div class="upload-area" id="uploadArea">
        <div style="font-size: 48px;">⬆️</div>
        <div style="font-size: 18px; margin: 10px 0;">点击选择图片或拖拽到此处</div>
        <div style="font-size: 14px; color: #666;">支持 JPG、PNG 格式</div>
    </div>
    
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    
    <div style="text-align: center; margin: 20px 0;">
        <button onclick="document.getElementById('fileInput').click()">选择图片</button>
        <button id="detectBtn" disabled>开始检测</button>
        <button onclick="testFileAPI()">测试功能</button>
    </div>
    
    <div id="messageArea">
        <div id="successBox" class="message success" style="display: none;">
            <strong>成功:</strong> <span id="successMessage"></span>
        </div>
        <div id="errorBox" class="message error" style="display: none;">
            <strong>错误:</strong> <span id="errorMessage"></span>
        </div>
    </div>
    
    <div class="image-container">
        <div class="image-box">
            <h3>原始图片</h3>
            <img id="originalImage" class="image-preview" src="" alt="原始图片">
        </div>
        <div class="image-box">
            <h3>算法标注</h3>
            <img id="annotatedImage" class="image-preview" src="" alt="标注图片">
        </div>
    </div>
    
    <div id="resultsSection" class="results">
        <h2>检测结果</h2>
        <p>这里是算法可视化结果...</p>
    </div>
    
    <script src="/static/visual_demo_fixed.js"></script>
    
    <script>
        // 确保JS文件加载后执行
        console.log('修复版HTML加载完成');
        
        // 如果JS文件加载失败，显示提示
        setTimeout(function() {
            if (typeof handleFileSelectFixed === 'undefined') {
                document.getElementById('errorBox').style.display = 'block';
                document.getElementById('errorMessage').textContent = 
                    'JavaScript文件加载失败，请检查控制台错误';
            }
        }, 1000);
    </script>
</body>
</html>
