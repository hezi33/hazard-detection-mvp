<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>最小化测试</title>
</head>
<body>
    <h1>最小化文件读取测试</h1>
    
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="testRead()">测试读取</button>
    
    <div id="status" style="margin: 20px 0; padding: 10px; background: #f0f0f0;"></div>
    <img id="preview" style="max-width: 400px; border: 1px solid #ccc;">
    
    <script>
        function testRead() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const preview = document.getElementById('preview');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                status.innerHTML = '<span style="color: red;">请先选择文件</span>';
                return;
            }
            
            const file = fileInput.files[0];
            status.innerHTML = `文件: ${file.name}, 类型: ${file.type}, 大小: ${file.size} bytes`;
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                preview.src = e.target.result;
                status.innerHTML += '<br><span style="color: green;">✅ 文件读取成功！图片已显示</span>';
                console.log('FileReader成功，数据长度:', e.target.result.length);
            };
            
            reader.onerror = function(e) {
                status.innerHTML += '<br><span style="color: red;">❌ 文件读取失败: ' + e.target.error + '</span>';
                console.error('FileReader错误:', e.target.error);
            };
            
            reader.readAsDataURL(file);
        }
        
        // 自动记录
        console.log('最小化测试页面加载完成');
        console.log('FileReader可用:', typeof FileReader !== 'undefined');
        console.log('File API可用:', typeof File !== 'undefined');
    </script>
</body>
</html>
